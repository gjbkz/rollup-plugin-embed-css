name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # Developer Git hook installation is unnecessary for build and test jobs.
  npm_config_ignore_scripts: 'true'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
  Test:
    name: Test (${{ matrix.os }}, ${{ matrix.node }})
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18.x, 16.x, 14.x]
        include:
          - os: ubuntu-latest
            node: 22.x
            coverage: true
          - os: ubuntu-latest
            node: 24.x
    # Keep the required check names while using Intel for legacy Node binaries.
    timeout-minutes: 15
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - run: git config --global core.eol lf
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Recent Selenium requires Node 20; retain the legacy-compatible driver binding.
      - run: npm install --no-save --package-lock=false --ignore-scripts selenium-webdriver@4.17.0
        if: matrix.node == '14.x' || matrix.node == '16.x' || matrix.node == '18.x'
      - run: npm run build
      - run: npm test
        if: ${{ !matrix.coverage }}
      - run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text npm test
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true
